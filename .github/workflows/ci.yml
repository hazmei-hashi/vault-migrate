name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage func report
        run: go tool cover -func=coverage.out

      - name: Coverage gate
        run: |
          set -euo pipefail
          # ponytail: awk on the `total:` line; no coverage-gate action dependency.
          # Ratchet floor — measured 77.7%. Raise this one number as coverage rises; never above current.
          THRESHOLD=73
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if [ -z "$total" ]; then
            echo "::error::failed to parse total coverage from coverage.out"; exit 1
          fi
          echo "Total coverage: ${total}% (threshold ${THRESHOLD}%)"
          awk -v t="$total" -v th="$THRESHOLD" 'BEGIN { exit (t+0 < th+0) }' \
            || { echo "::error::coverage ${total}% below threshold ${THRESHOLD}%"; exit 1; }

      - name: Generate HTML coverage report
        if: always() && hashFiles('coverage.out') != ''
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error
